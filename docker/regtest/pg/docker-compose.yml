
services:
  postgres:
    image: postgres:18.1-alpine3.21@sha256:44d837eb4c2ed263474a95f0cc24745413c50924df60dd73ed6c4c3e36b84259
    restart: unless-stopped
    labels:
      org.springframework.boot.ignore: true
    volumes:
      - demente-postgres-data:/postgresql_data
      - ./data/pg/init:/docker-entrypoint-initdb.d/
    environment:
      POSTGRES_ADDITIONAL_DATABASES: regtest_nostr_relay0
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: /postgresql_data
    ports:
      - "15432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --username=$$POSTGRES_USER", "--dbname=postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.14.0@sha256:ff557f69d9808085dc3554f56c1b06a36ac8cddabe4485212920b9604261abdb
    restart: unless-stopped
    volumes:
      - demente-pgadmin-data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: postgres@example.org
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "15532:80"
    depends_on:
      postgres:
        condition: service_healthy

  lgtm-stack:
    image: grafana/otel-lgtm:0.27.1@sha256:f533fb9c059aad2d47658e9dc059289755d992404b62168b40b3fbcbe4623355
    extra_hosts: [ 'host.docker.internal:host-gateway' ]
    container_name: lgtm-stack
    environment:
      - OTEL_METRIC_EXPORT_INTERVAL=30000
    ports:
      - "3000:3000" # grafana
      - "3200:3200" # tempo
      - "4040:4040" # Pyroscope
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "9090:9090" # Prometheus

volumes:
  demente-postgres-data:
  demente-pgadmin-data:
