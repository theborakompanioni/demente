services:

  app:
    build:
      context: .
      dockerfile: ./devel.Dockerfile
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9001:9001"
    command: >
      --spring.profiles.active=development
      --spring.datasource.url=jdbc:postgresql://postgres:5432/regtest_nostr_relay0
      --spring.datasource.username=regtest_nostr_relay0
      --spring.datasource.password=regtest_nostr_relay0
      --spring.datasource.driver-class-name=org.postgresql.Driver
      --spring.datasource.hikari.pool-name=PostgresPool
      --spring.datasource.hikari.maximum-pool-size=10
      --spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
      --spring.http.log-request-details=false
      --logging.level.web=INFO

  postgres:
    image: postgres:18.1-alpine3.21@sha256:44d837eb4c2ed263474a95f0cc24745413c50924df60dd73ed6c4c3e36b84259
    restart: no
    labels:
      org.springframework.boot.ignore: true
    volumes:
      - demente-postgres-data:/postgresql_data
      - ./docker/regtest/pg/data/pg/init:/docker-entrypoint-initdb.d/
    environment:
      POSTGRES_ADDITIONAL_DATABASES: regtest_nostr_relay0
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: /postgresql_data
    ports:
      - "15432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --dbname=postgres --username=postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.12.0@sha256:10137f33be7ed61e47f56004493710cb5b80ba7fb0ca01758855e242f1f284a7
    restart: no
    volumes:
      - demente-pgadmin-data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: postgres@example.org
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "15532:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  demente-postgres-data:
  demente-pgadmin-data:
