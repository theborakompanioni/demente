spring.application.name: 'demented-dev'
spring.http.log-request-details: true

# LOGGING
logging.file.name: application-dev.log
logging.config: classpath:logback-development.xml
logging.level.org.springframework: INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE
logging.level.web: DEBUG
logging.level.org.tbk.nostr: DEBUG
logging.level.org.tbk.nostr.demented.domain.event: TRACE

spring.datasource.url: 'jdbc:sqlite:demented-dev.db?foreign_keys=true&journal_mode=WAL&synchronous=OFF&temp_store=MEMORY&page_size=32768&mmap_size=30000000000'

spring.jpa.properties.hibernate.format_sql: true
spring.jpa.properties.hibernate.show_sql: true

management.endpoints.web.exposure.include: '*'
management.metrics.tags.service.name: ${spring.application.name}
management.tracing.sampling.probability: 1.0
management.otlp.metrics.export.url: http://localhost:4318/v1/metrics
management.otlp.tracing.endpoint: http://localhost:4318/v1/traces
management.otlp.logging.endpoint: http://localhost:4318/v1/logs
